# 「変化理由」の自動分類キーワード（部分一致・全角半角は自動で揃えます）
# 自動分類は「案」です。最終判断は分類画面で人が確認・修正してください。
# 関心・意欲の変化は「その他」で拾い、否定・未実施の表現は判定から除外します。

categories:
  knowledge:   # 知識：わかるようになった・理解した・学んだ
    - 知識
    - 知っ
    - 知れ
    - 知る
    - 知ること
    - 理解
    - わかっ
    - わかる
    - 分かっ
    - 分かる
    - 分かり
    - 分り
    - 学ん
    - 学べ
    - 学び
    - 勉強
    - 仕組み
    - 用語
    - 基礎
    - 覚えた
    - 慣れ
    - 輪郭
  action:      # 行動：実際にやった・始めた・続けている（情報収集の習慣を含む）
    - 開設
    - 口座
    - 積立
    - 積み立て
    - 購入
    - 買え
    - 買っ
    - 売買

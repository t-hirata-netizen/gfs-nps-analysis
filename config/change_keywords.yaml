# 否定・未実施の部分は分類の判定から除く（正規表現。句読点をまたがず直前12文字まで）
negation_patterns:
  - "[^、。,.\\s!！?？]{0,12}(?:ていない|てない|ていません|てません|ていなく|いかない|変わりない|変わらない|変わっていない|いたりません|できない|出来ない)"

# 完全一致したら「分類不可」にする記述
unclassifiable_exact:
  - 特になし
  - とくになし
  - 特にない
  - なし
  - ない
  - 特に
  - まだ
  - わからない
  - 分からない

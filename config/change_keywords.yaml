    - nisa
    - ideco
    - 家計簿
    - 家計の見直し
    - 見直し
    - 節約
    - 無駄遣いが減
    - 無駄を排除
    - 出費を抑え
    - 習慣
    - 毎日
    - 始めた
    - 始めま
    - 始め出
    - はじめた
    - 参加
    - 頻度
    - 四季報
    - 調べ
    - 確認して
    - 眺め
    - 見るようになっ
    - 見る様になっ
    - 読むようになっ
    - 見ることが増え
    - 目を向ける
    - 深読み
    - 見直す
    - 買わなく
    - 確認をして
  judgment:    # 判断：考え方・見方・価値観・意思決定が変わった
    - 判断
    - 考え方
    - 考えるよう
    - 考える様
    - 考えを
    - 考えが
    - 意識
    - 見方
    - 味方が変わ   # 「見方」の誤字
    - の味方は
    - 視点

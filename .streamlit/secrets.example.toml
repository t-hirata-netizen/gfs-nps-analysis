# Streamlit Community Cloud の「Secrets」欄に貼る内容の見本（実際の値は Git に入れない）
GFS_CLOUD = "1"
GFS_STORAGE = "drive"
GFS_DRIVE_FILE_ID = "ドライブに置いた gfs_analysis.db のファイルID"

[gcp_service_account]
# Google Cloud でダウンロードしたサービスアカウントの鍵（JSON）の中身を、そのまま TOML に書き写す
type = "service_account"
project_id = "..."
private_key_id = "..."
private_key = "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----\n"
client_email = "...@....iam.gserviceaccount.com"
client_id = "..."
token_uri = "https://oauth2.googleapis.com/token"
